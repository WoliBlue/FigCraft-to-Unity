<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e5e7eb"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <text x="640" y="78" text-anchor="middle" font-size="46" font-weight="700" fill="#f9fafb">FigCraft to Unity Tool</text>
  <text x="640" y="114" text-anchor="middle" font-size="20" fill="#9ca3af">Capture your running game's UI, edit it in FigCraft, apply the changes back.</text>

  <!-- Unity side -->
  <g transform="translate(150 160)">
    <rect width="330" height="150" rx="18" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="22" y="22" width="286" height="20" rx="6" fill="#374151"/>
    <circle cx="36" cy="32" r="4" fill="#9ca3af"/>
    <circle cx="50" cy="32" r="4" fill="#9ca3af"/>
    <polygon points="158,26 166,32 158,38" fill="#22c55e"/>
    <rect x="22" y="58" width="130" height="16" rx="5" fill="#4b5563"/>
    <rect x="22" y="84" width="200" height="32" rx="8" fill="#2563eb"/>
    <text x="165" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#e5e7eb">Unity · Play Mode (uGUI)</text>
  </g>

  <!-- FigCraft side -->
  <g transform="translate(800 160)">
    <rect width="330" height="150" rx="18" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="22" y="22" width="60" height="94" rx="6" fill="#374151"/>
    <rect x="30" y="34" width="44" height="8" rx="3" fill="#6b7280"/>
    <rect x="30" y="50" width="36" height="8" rx="3" fill="#6b7280"/>
    <rect x="30" y="66" width="40" height="8" rx="3" fill="#6b7280"/>
    <rect x="98" y="22" width="210" height="94" rx="10" fill="url(#fig)"/>
    <rect x="96" y="20" width="214" height="98" rx="11" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="165" y="138" text-anchor="middle" font-size="17" font-weight="600" fill="#e5e7eb">FigCraft · editable layers</text>
  </g>

  <!-- arrows -->
  <path d="M500 205 C 580 175, 700 175, 780 205" fill="none" stroke="#e5e7eb" stroke-width="3" marker-end="url(#head)"/>
  <text x="640" y="172" text-anchor="middle" font-size="16" font-weight="600" fill="#f9fafb">Capture</text>
  <path d="M780 270 C 700 300, 580 300, 500 270" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#head)"/>
  <text x="640" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#f9fafb">Apply changes</text>
</svg>
